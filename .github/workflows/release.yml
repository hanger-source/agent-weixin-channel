name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm pack --dry-run
      - name: Resolve release identity and npm dist-tag
        id: identity
        run: >-
          node scripts/check-release-identity.mjs
          --tag "${{ github.event.release.tag_name }}"
          --github-prerelease "${{ github.event.release.prerelease }}"
          --github-output "$GITHUB_OUTPUT"
      - run: npm publish --tag "${{ steps.identity.outputs.npm_tag }}"
